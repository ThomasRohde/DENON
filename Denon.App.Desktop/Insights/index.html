<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Denon Insights</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" id="theme-css" href="/theme.css">
  <link rel="stylesheet" href="/insights.css">
  <script src="/insights.js" defer></script>
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <img src="/icon.png" alt="" width="22" height="22">
      <span class="brand-name">Denon Desktop</span>
      <span class="brand-page">Insights</span>
    </div>
    <nav class="period" aria-label="Period">
      <button type="button" class="chip" data-days="1">Today</button>
      <button type="button" class="chip" data-days="7">7 days</button>
      <button type="button" class="chip" data-days="30">30 days</button>
      <button type="button" class="chip" data-days="90">90 days</button>
    </nav>
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="led" aria-hidden="true"></span><span class="status-text">Connecting…</span>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="wrap">
    <section class="hero" aria-label="Summary">
      <div class="vfd" id="vfd"></div>
      <div class="card now" id="now"></div>
    </section>

    <section class="observations" id="observations" aria-label="Observations"></section>

    <section class="grid">
      <article class="card span-8" id="daily"></article>
      <article class="card span-4" id="kinds"></article>
      <article class="card span-8" id="rhythm"></article>
      <article class="card span-4" id="apps"></article>
      <article class="card span-6" id="titles"></article>
      <article class="card span-6" id="volume"></article>
      <article class="card span-6" id="receiver"></article>
      <article class="card span-6" id="control"></article>
      <article class="card span-12" id="activity"></article>
    </section>

    <footer class="footer" id="footer"></footer>
  </main>

  <div class="tip" id="tip" role="tooltip" hidden></div>
</body>
</html>
