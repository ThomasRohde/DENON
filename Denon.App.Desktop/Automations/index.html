<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Automations · Denon Desktop</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" id="theme-css" href="/theme.css">
  <link rel="stylesheet" href="/automations/editor.css">
  <script src="/automations/editor.js" defer></script>
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <img src="/icon.png" alt="" width="22" height="22">
      <span class="brand-name">Denon Desktop</span>
      <span class="brand-page">Automations</span>
    </div>
    <div class="doc" id="doc">
      <span class="doc-name" id="doc-name"></span>
      <span class="doc-dirty" id="doc-dirty" title="Unsaved changes" hidden></span>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Automation">
      <button type="button" class="btn primary" id="btn-save" title="Save (Ctrl+S)">Save</button>
      <button type="button" class="btn" id="btn-dry" title="Walk the graph without changing anything">Dry run</button>
      <button type="button" class="btn warn" id="btn-run" title="Run the actions for real">Run now</button>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="led" aria-hidden="true"></span><span class="status-text">Connecting…</span>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" role="alert" hidden></div>

  <main class="layout" id="layout">
    <aside class="sidebar" aria-label="Automations">
      <div class="side-head">
        <h2 class="label">Automations</h2>
        <div class="side-actions">
          <button type="button" class="btn small" id="btn-new">New</button>
          <button type="button" class="btn small" id="btn-dup" title="Duplicate this automation">Duplicate</button>
          <button type="button" class="btn small danger" id="btn-del" title="Delete this automation">Delete</button>
        </div>
      </div>
      <ul class="graph-list" id="graph-list"></ul>
    </aside>

    <nav class="palette" id="palette" aria-label="Add a node">
      <button type="button" class="palette-toggle" id="palette-toggle" aria-expanded="true" aria-controls="palette-body" title="Show or hide the node palette">
        <span class="palette-plus" aria-hidden="true">+</span><span class="palette-toggle-text">Nodes</span>
      </button>
      <div class="palette-body" id="palette-body"></div>
    </nav>

    <section class="stage" aria-label="Canvas">
      <div class="canvas" id="canvas" tabindex="-1">
        <div class="world" id="world"></div>
        <div class="canvas-empty" id="canvas-empty" hidden></div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" class="btn icon" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <span class="zoom-level mono" id="zoom-level">100 %</span>
        <button type="button" class="btn icon" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button type="button" class="btn small" id="zoom-fit" title="Fit the graph in view">Fit</button>
      </div>
      <button type="button" class="btn small events-toggle" id="events-toggle" aria-expanded="false" aria-controls="events">Recent events</button>
      <aside class="run-card" id="run-card" aria-label="Last run" hidden></aside>
      <section class="events" id="events" aria-label="Recent events" hidden>
        <div class="events-head">
          <h2 class="label">Recent events</h2>
          <span class="muted events-hint">Use one as the trigger of this automation.</span>
          <button type="button" class="btn small" id="events-refresh">Refresh</button>
          <button type="button" class="btn icon" id="events-close" aria-label="Close recent events">×</button>
        </div>
        <div class="events-list" id="events-list"></div>
      </section>
    </section>

    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
  </main>

  <dialog class="dialog" id="dialog" aria-labelledby="dialog-title">
    <h2 class="dialog-title" id="dialog-title"></h2>
    <p class="dialog-text" id="dialog-text"></p>
    <div class="dialog-actions" id="dialog-actions"></div>
  </dialog>

  <datalist id="event-names"></datalist>
</body>
</html>
