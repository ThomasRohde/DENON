<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volume Memory · Denon Desktop</title>
<style>
/*@shared-css*/
.rows { display: grid; gap: 6px; margin-top: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto; gap: 8px; align-items: center;
       padding: 8px 10px; border-radius: 8px; background: var(--color-background-secondary); }
.row.current { outline: 1px solid var(--accent); }
.row .label { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.row .meta { font-size: 11px; color: var(--color-text-secondary); }
.row .level { font-family: var(--font-mono); font-size: 13px; min-width: 6.5em; text-align: right; white-space: nowrap; }
.now { font-size: 10px; font-weight: 700; color: var(--accent); margin-left: 6px; }
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="top"><span class="name">Volume memory</span><span class="right" id="pills"></span></div>
  <h1 id="title">Loading…</h1>
  <p class="detail" id="detail"></p>
  <div class="rows" id="rows"></div>
  <div class="buttons"><button id="refresh">Refresh</button></div>
  <p class="status" id="status"></p>
</main>
<script>
/*@shared-js*/
</script>
<script>
"use strict";
const { $, el } = Card;
let state = null;

const KINDS = { tv_channel: "TV channel", tv_app: "TV app", cast: "Cast", appletv: "Apple TV", input: "Input" };

function setLevel(item, level) {
  const target = Math.max(0, Math.min(state.safeVolume, level));
  return Card.run(`${item.label}: ${target}`, async () => {
    await Card.callTool("volume_memory_set_level", { key: item.key, level: target });
    await Card.reload({});
  });
}

function render(data) {
  state = data;
  const levels = data.levels || [];
  $("pills").replaceChildren(
    el("span", { className: `pill ${data.enabled ? "on" : "warn"}` }, data.enabled ? "On" : "Off"),
    ...(data.onlyLower ? [el("span", { className: "pill" }, "Only lowers")] : []));
  $("title").textContent = `${levels.length} learned level${levels.length === 1 ? "" : "s"}`;
  $("detail").textContent = `When the source changes, the receiver goes to the source's level if it differs by ${data.minDifference} or more. Never above ${data.safeVolume}.`;
  $("rows").replaceChildren(...(levels.length ? levels.map((item) => el("div", { className: `row ${item.key === data.current ? "current" : ""}` },
    el("div", {},
      el("div", { className: "label" }, item.label, item.key === data.current ? el("span", { className: "now" }, "NOW") : null),
      el("div", { className: "meta" }, `${KINDS[item.kind] || item.kind} · ${item.minutes} min listened · ${item.updated}`)),
    el("button", { className: "step", disabled: !data.canEdit, "aria-label": `Lower ${item.label}`, onclick: () => setLevel(item, item.level - 2) }, "−"),
    el("span", { className: "level" }, `${item.level} · ${item.levelDb}`),
    el("button", { className: "step", disabled: !data.canEdit || item.level >= data.safeVolume, "aria-label": `Raise ${item.label}`, onclick: () => setLevel(item, item.level + 2) }, "+"),
    el("button", { className: "small", disabled: !data.canEdit, title: "Forget this level; it is learned again", onclick: () =>
      Card.run(`Forgetting ${item.label}`, async () => { await Card.callTool("volume_memory_forget", { key: item.key }); await Card.reload({}); }) }, "Forget")))
    : [el("p", { className: "empty" }, "Nothing learned yet. Levels appear after you listen to a source for a while.")]));
  if (!data.canEdit) Card.setStatus("Changing levels needs the FullOrchestration permission tier in Denon Desktop.");
  Card.resize();
}

$("refresh").addEventListener("click", () => Card.run("Reading", () => Card.reload({})));

Card.start({
  name: "denon-volume-memory",
  tool: "show_volume_memory",
  render,
  outsideHost() {
    $("title").textContent = "Open this card from an MCP host";
    $("detail").textContent = "It is shown by the Denon Desktop tool show_volume_memory in an MCP Apps host.";
  },
});
</script>
</body>
</html>
