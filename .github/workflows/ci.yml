# Checks for every pull request and every push to master: the app's tests, the external plugins (they are not in
# DenonDesktop.slnx, so a Core or SDK change could break them unseen), and the website build.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the app
        shell: pwsh
        run: |
          dotnet test .\DenonDesktop.slnx -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "App tests failed." }

  plugins:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the Apple TV and HomePod plugins
        shell: pwsh
        run: |
          dotnet test external-plugins/Denon.Plugin.AppleTv.Tests/Denon.Plugin.AppleTv.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Apple TV plugin tests failed." }
          dotnet test external-plugins/Denon.Plugin.HomePod.Tests/Denon.Plugin.HomePod.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "HomePod plugin tests failed." }

      - name: Build the Chromecast plugin
        shell: pwsh
        run: |
          dotnet build external-plugins/Denon.Plugin.Chromecast/Denon.Plugin.Chromecast.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Chromecast plugin build failed." }

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the website
        working-directory: site
        run: |
          npm ci
          npm run build
