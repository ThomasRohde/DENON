name: Release Apple TV Plugin

# Standalone release of the external Apple TV plugin, separate from the app (tags v*).
# Push a tag appletv-vX.Y.Z that matches <Version> in Denon.Plugin.AppleTv.csproj.
on:
  push:
    tags:
      - 'appletv-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      PLUGIN_DIR: external-plugins/Denon.Plugin.AppleTv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read and check version
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "$env:PLUGIN_DIR/Denon.Plugin.AppleTv.csproj"
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          $ref = "${{ github.ref_name }}"
          if ($ref -like 'appletv-v*') {
            $tagVersion = $ref.Substring('appletv-v'.Length)
            if ($tagVersion -ne $version) {
              throw "Tag $ref does not match <Version>$version</Version> in Denon.Plugin.AppleTv.csproj."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test plugin
        shell: pwsh
        run: |
          dotnet test external-plugins/Denon.Plugin.AppleTv.Tests/Denon.Plugin.AppleTv.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }

      - name: Publish plugin
        shell: pwsh
        run: |
          dotnet publish "$env:PLUGIN_DIR/Denon.Plugin.AppleTv.csproj" -c Release -o .\plugin-out\AppleTv --nologo
          if ($LASTEXITCODE -ne 0) { throw "Publish failed." }
          if (Test-Path .\plugin-out\AppleTv\Denon.App.PluginSdk.dll) {
            throw "The SDK must not ship with the plugin (the host provides it)."
          }
          if (-not (Test-Path .\plugin-out\AppleTv\BouncyCastle.Cryptography.dll)) {
            throw "BouncyCastle.Cryptography.dll is missing (Ed25519, X25519, SRP group)."
          }
          Copy-Item "$env:PLUGIN_DIR/README.md", "$env:PLUGIN_DIR/CHANGELOG.md", "$env:PLUGIN_DIR/THIRD-PARTY-NOTICES.md", .\LICENSE .\plugin-out\AppleTv\
          Get-ChildItem .\plugin-out\AppleTv | Format-Table Name, Length -AutoSize

      - name: Package zip and checksum
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force .\release-out | Out-Null
          $zipName = "Denon.Plugin.AppleTv-$version.zip"
          Compress-Archive -Path .\plugin-out\AppleTv\* -DestinationPath ".\release-out\$zipName" -Force
          $hash = (Get-FileHash ".\release-out\$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content .\release-out\SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Denon.Plugin.AppleTv-${{ steps.version.outputs.version }}
          path: release-out/*

      - name: Release notes from plugin CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/appletv-v')
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelog = Get-Content "$env:PLUGIN_DIR/CHANGELOG.md" -Raw
          $pattern = "(?ms)^##\s+\[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^##\s+\[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          $body = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "Apple TV plugin $version." }
          $sha = (Get-Content .\release-out\SHA256SUMS.txt -Raw).Trim()
          $fence = '```'
          @(
            $body,
            '',
            '---',
            '',
            '### Install',
            "1. Download ``Denon.Plugin.AppleTv-$version.zip``.",
            '2. Unzip it to `%LocalAppData%\DenonDesktop\plugins\external\AppleTv\` (close Denon Desktop first when you update).',
            '3. Start Denon Desktop, open **Plugins → Apple TV**, press **Discover now**, then **Pair** and type the PIN the TV shows.',
            '',
            'Use it with the matching Denon Desktop release. This is a separate release; the app itself is released with `v*` tags.',
            '',
            '### SHA-256 Checksum',
            "${fence}text",
            $sha,
            $fence
          ) -join "`n" | Set-Content .\release-out\RELEASE_NOTES.md -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/appletv-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Apple TV Plugin v${{ steps.version.outputs.version }}
          body_path: release-out/RELEASE_NOTES.md
          make_latest: false
          files: |
            release-out/Denon.Plugin.AppleTv-${{ steps.version.outputs.version }}.zip
            release-out/SHA256SUMS.txt
