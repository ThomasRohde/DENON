# The website (site/, Astro) on GitHub Pages: https://thomasrohde.github.io/DENON/
# It is built from the app's own design tokens, icons, Help topics and versions (site/scripts/sync-from-app.mjs),
# so it also rebuilds when those change.
name: Website

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "Denon.App.Desktop/Themes/**"
      - "Denon.App.Desktop/Controls/MeterPalette.cs"
      - "Denon.App.Desktop/ViewModels/MainViewModel.Help.cs"
      - "Denon.App.Desktop/Denon.App.Desktop.csproj"
      - "external-plugins/*/*.csproj"
      - "Denon.App.Desktop/denon_icon.png"
      - ".github/workflows/pages.yml"
  # The download page links to release files: build again once a release (app or plugin) is published.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
