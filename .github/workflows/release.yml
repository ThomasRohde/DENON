name: Release Windows Single-File EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file win-x64 executable
        shell: pwsh
        run: |
          dotnet publish .\Denon.App.Desktop\Denon.App.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\release-out

          Move-Item .\release-out\Denon.App.Desktop.exe .\release-out\Denon.App.Desktop-win-x64.exe -Force
          Remove-Item .\release-out\*.xml -Force -ErrorAction SilentlyContinue

          $hash = (Get-FileHash .\release-out\Denon.App.Desktop-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Denon.App.Desktop-win-x64.exe" | Set-Content -Path .\release-out\SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Denon.App.Desktop-win-x64
          path: |
            release-out/Denon.App.Desktop-win-x64.exe
            release-out/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-out/Denon.App.Desktop-win-x64.exe
            release-out/SHA256SUMS.txt
