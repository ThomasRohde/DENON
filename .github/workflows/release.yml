name: Release Windows Single-File EXE & Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write # starts the website build after the release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content .\Denon.App.Desktop\Denon.App.Desktop.csproj
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($tagVersion -ne $version) {
            throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in Denon.App.Desktop.csproj."
          }
          $section = "(?m)^##\s+\[$([regex]::Escape($version))\]"
          if (-not ((Get-Content .\CHANGELOG.md -Raw) -match $section)) {
            throw "CHANGELOG.md has no section [$version]."
          }

      - name: Run automated tests
        shell: pwsh
        run: |
          dotnet test .\DenonDesktop.slnx -c Release --verbosity normal
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }

      - name: Publish single-file win-x64 executable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          dotnet publish .\Denon.App.Desktop\Denon.App.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\release-out
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }

          Move-Item .\release-out\Denon.App.Desktop.exe .\release-out\Denon.App.Desktop-win-x64.exe -Force
          Remove-Item .\release-out\*.xml -Force -ErrorAction SilentlyContinue

      - name: Build Unsigned Windows Installer (Inno Setup)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc -and (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not $iscc -and (Test-Path 'C:\Program Files\Inno Setup 6\ISCC.exe')) {
            $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe'
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed with exit code $LASTEXITCODE." }
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }

          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+)') {
            $version = $Matches[1]
          } else {
            [xml]$csproj = Get-Content .\Denon.App.Desktop\Denon.App.Desktop.csproj
            $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
            if ($version -notmatch '^\d+\.\d+\.\d+') { throw "<Version>$version</Version> does not start with X.Y.Z." }
            $version = $Matches[0]
          }
          $outDir = (Resolve-Path .\release-out).Path
          $srcExe = Join-Path $outDir 'Denon.App.Desktop-win-x64.exe'

          & $iscc "/DMyAppVersion=$version" "/DMySourceExe=$srcExe" "/DMyOutputDir=$outDir" .\installer\DenonDesktop.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compiler failed with exit code $LASTEXITCODE"
          }

          $exeHash = (Get-FileHash (Join-Path $outDir 'Denon.App.Desktop-win-x64.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash (Join-Path $outDir 'DenonDesktop-Setup-win-x64.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$setupHash  DenonDesktop-Setup-win-x64.exe",
            "$exeHash  Denon.App.Desktop-win-x64.exe"
          ) | Set-Content -Path (Join-Path $outDir 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Denon.App.Desktop-win-x64
          path: |
            release-out/DenonDesktop-Setup-win-x64.exe
            release-out/Denon.App.Desktop-win-x64.exe
            release-out/SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $changelog = Get-Content -Path .\CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+\[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^##\s+\[|^\[[^\]]+\]:|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md has no section for $version."
          }
          $sectionBody = $match.Groups[1].Value.Trim()

          $sha = (Get-Content .\release-out\SHA256SUMS.txt -Raw).Trim()
          $fence = '```'
          $lines = @(
            $sectionBody,
            '',
            '---',
            '',
            '### Downloads (No .NET Runtime Required)',
            '- **Windows Installer (Unsigned):** `DenonDesktop-Setup-win-x64.exe` — Start Menu & optional Desktop / Startup shortcuts, clean Add/Remove Programs uninstaller. *(Because this open-source build is unsigned, Windows SmartScreen may show a warning — click **More info → Run anyway**.)*',
            '- **Portable Single-File Executable:** `Denon.App.Desktop-win-x64.exe` — run directly from any folder with zero installation.',
            '',
            '### SHA-256 Checksums',
            "${fence}text",
            $sha,
            $fence
          )
          ($lines -join "`n") | Set-Content -Path .\release-out\RELEASE_NOTES.md -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Denon Desktop ${{ github.ref_name }}
          body_path: release-out/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            release-out/DenonDesktop-Setup-win-x64.exe
            release-out/Denon.App.Desktop-win-x64.exe
            release-out/SHA256SUMS.txt

      # A release made with this workflow's token starts no other workflow, so start the website build here: its
      # download links need the new tag.
      - name: Rebuild the website
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref master
          if ($LASTEXITCODE -ne 0) { throw "Starting the website build failed." }
